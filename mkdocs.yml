site_name: Code Akos
site_description: Code Akos is free, self-hosted error tracking for Sentry SDKs. It groups errors, files GitHub issues and has a local or hosted LLM open fix pull requests.
site_url: https://ayesh96.github.io/code-akos/
repo_url: https://github.com/Ayesh96/code-akos
repo_name: Ayesh96/code-akos
edit_uri: edit/main/docs/

theme:
  name: material
  custom_dir: overrides
  # The app's look: the icon's palette (dark first, as the app is), Geist, and the app icon.
  # Colours live in docs/assets/stylesheets/code-akos.css.
  font:
    text: Geist
    code: Geist Mono
  logo: assets/icon.png
  favicon: assets/favicon.png
  palette:
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - content.code.copy
    - content.tabs.link
    - search.suggest
    - search.highlight

extra_css:
  - assets/stylesheets/code-akos.css

# Google Analytics 4, loaded only after a visitor accepts cookies in the consent banner.
extra:
  # Hides the theme's "Made with Material for MkDocs" footer credit.
  generator: false
  analytics:
    provider: google
    property: G-DE18K33SMK
  consent:
    title: Cookie consent
    description: >-
      This site uses cookies to count visits and see which pages people read, through
      Google Analytics. Nothing is tracked unless you accept. Code Akos itself sends no analytics.
    actions:
      - accept
      - reject
      - manage

copyright: <a href="#__consent">Change cookie settings</a>

# Raw data stays in the repo but is not published. docs/internal/ is gitignored and never built.
exclude_docs: |
  internal/
  triage-results/

# Builds the FAQ page's structured data from its questions. See the file for details.
hooks:
  - overrides/hooks/seo.py

nav:
  - Home: index.md
  - Get started:
      - Installation: installation.md
      - Getting started: getting-started.md
      - Using the dashboard: usage.md
      - Running in Docker: docker.md
  - Guides:
      - Sentry alternatives compared: sentry-alternative.md
      - Self-hosted error tracking: self-hosted-error-tracking.md
      - Sentry errors to GitHub issues: sentry-errors-to-github-issues.md
      - AI bug fixes as pull requests: ai-bug-fix-pull-requests.md
      - Error triage with Ollama: local-llm-error-triage.md
  - Reference:
      - FAQ: faq.md
      - Configuration and security: reference.md
      - Triage test results: TRIAGE-BEFORE-AFTER.md
      - Triage scenarios: TRIAGE-SCENARIOS.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
