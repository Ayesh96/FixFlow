site_name: FixFlow
site_description: Self-hosted, Sentry-compatible error tracking that files GitHub issues and has an LLM (Ollama, DeepSeek or Anthropic) open fix pull requests.
site_url: https://ayesh96.github.io/FixFlow/
repo_url: https://github.com/Ayesh96/FixFlow
repo_name: Ayesh96/FixFlow
edit_uri: edit/main/docs/

theme:
  name: material
  custom_dir: overrides
  # The app's look: its neutral palette (dark first, as the app is), Geist, and its layers mark.
  # Colours live in docs/assets/stylesheets/fixflow.css.
  font:
    text: Geist
    code: Geist Mono
  icon:
    logo: fixflow/layers
  favicon: assets/favicon.svg
  palette:
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy

extra_css:
  - assets/stylesheets/fixflow.css

# Google Analytics 4, loaded only after a visitor accepts cookies in the consent banner.
extra:
  # Hides the theme's "Made with Material for MkDocs" footer credit.
  generator: false
  analytics:
    provider: google
    property: G-DE18K33SMK
  consent:
    title: Cookie consent
    description: >-
      This site uses cookies to count visits and see which pages people read, through
      Google Analytics. Nothing is tracked unless you accept. FixFlow itself sends no analytics.
    actions:
      - accept
      - reject
      - manage

copyright: <a href="#__consent">Change cookie settings</a>

# Raw data stays in the repo but is not published. docs/internal/ is gitignored and never built.
exclude_docs: |
  internal/
  triage-results/
  assets/social-preview.*

nav:
  - Home: index.md
  - Guides:
      - Self-hosted error tracking: self-hosted-error-tracking.md
      - Sentry alternative: sentry-alternative.md
      - Sentry errors to GitHub issues: sentry-errors-to-github-issues.md
      - AI fixes as pull requests: ai-bug-fix-pull-requests.md
      - Error triage with Ollama: local-llm-error-triage.md
  - Reference:
      - Projects, ports and settings: reference.md
      - Triage test results: TRIAGE-BEFORE-AFTER.md
      - Triage scenarios: TRIAGE-SCENARIOS.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
